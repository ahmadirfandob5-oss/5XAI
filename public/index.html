<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5XAI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-glow"></div>

    <main class="app">
        <header class="topbar">
            <div class="brand">
                <div class="logo">✦</div>
                <div>
                    <h1>5XAI</h1>
                    <span>LOCAL AI</span>
                </div>
            </div>

            <button class="settings" title="Settings">⚙</button>
        </header>

        <section id="chat" class="chat">
            <div class="welcome">
                <div class="welcome-logo">✦</div>
                <h2>Welcome to 5XAI</h2>
                <p>Your private local AI assistant.</p>
            </div>
        </section>

        <form id="chat-form" class="input-area">
            <input
                id="message"
                type="text"
                placeholder="Message 5XAI..."
                autocomplete="off"
            />

            <button type="submit" id="send-button">➤</button>
        </form>
    </main>

    <script src="app.js"></script>
</body>
</html>
